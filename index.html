<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investiční Kalkulátor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button {
            grid-column: 1 / -1;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .result-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .result-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }
        
        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Investiční Kalkulátor</h1>
        
        <div class="inputs">
            <div class="input-group">
                <label for="initialAmount">Počáteční Investice (Kč)</label>
                <input type="number" id="initialAmount" value="10000" min="0">
            </div>
            
            <div class="input-group">
                <label for="monthlyInvestment">Měsíční Příspěvek (Kč)</label>
                <input type="number" id="monthlyInvestment" value="1000" min="0">
            </div>
            
            <div class="input-group">
                <label for="annualReturn">Roční Výnos (%)</label>
                <input type="number" id="annualReturn" value="8" min="0" max="100" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="years">Počet Let</label>
                <input type="number" id="years" value="10" min="1" max="50">
            </div>
            
            <button onclick="calculateInvestment()">Vypočítaj 🚀</button>
        </div>
        
        <div class="results">
            <div class="result-box">
                <div class="result-label">Celková Investice</div>
                <div class="result-value" id="totalInvested">0 Kč</div>
            </div>
            <div class="result-box">
                <div class="result-label">Výnos</div>
                <div class="result-value" id="totalGain">0 Kč</div>
            </div>
            <div class="result-box">
                <div class="result-label">Konečná Hodnota</div>
                <div class="result-value" id="finalAmount">0 Kč</div>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="investmentChart"></canvas>
        </div>
        
        <div class="info">
            <strong>💡 Jak to funguje:</strong><br>
            Zadejte svoji počáteční investici, měsíční příspěvek a očekávaný roční výnos. Aplikace vám ukáže, jak vaše peníze porostou v čase. Graf ukazuje růst vaší investice měsíc od měsíce.
        </div>
    </div>

    <script>
        let chart = null;

        function calculateInvestment() {
            const initialAmount = parseFloat(document.getElementById('initialAmount').value) || 0;
            const monthlyInvestment = parseFloat(document.getElementById('monthlyInvestment').value) || 0;
            const annualReturn = parseFloat(document.getElementById('annualReturn').value) / 100 / 12; // měsíční výnos
            const years = parseInt(document.getElementById('years').value) || 1;
            
            const months = years * 12;
            let balance = initialAmount;
            const data = [];
            const labels = [];
            
            // Počáteční stav
            data.push(balance);
            labels.push('Měsíc 0');
            
            // Simulace měsíc po měsíci
            for (let month = 1; month <= months; month++) {
                balance = balance * (1 + annualReturn) + monthlyInvestment;
                data.push(Math.round(balance));
                labels.push(`Měsíc ${month}`);
            }
            
            // Výpočty
            const totalInvested = initialAmount + (monthlyInvestment * months);
            const finalAmount = Math.round(balance);
            const totalGain = finalAmount - totalInvested;
            
            // Aktualizace výsledků
            document.getElementById('totalInvested').textContent = 
                formatCurrency(totalInvested);
            document.getElementById('totalGain').textContent = 
                formatCurrency(totalGain);
            document.getElementById('finalAmount').textContent = 
                formatCurrency(finalAmount);
            
            // Aktualizace grafu
            updateChart(labels, data);
        }
        
        function updateChart(labels, data) {
            const ctx = document.getElementById('investmentChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Hodnota Investice (Kč)',
                        data: data,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 12, weight: 'bold' }
                            }
                        },
                        title: {
                            display: true,
                            text: 'Vývoj Vaší Investice v Čase',
                            font: { size: 16, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return formatCurrency(value);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function formatCurrency(value) {
            return new Intl.NumberFormat('cs-CZ', {
                style: 'currency',
                currency: 'CZK',
                maximumFractionDigits: 0
            }).format(value);
        }
        
        // Spuštění beim načtení
        calculateInvestment();
    </script>
</body>
</html>
